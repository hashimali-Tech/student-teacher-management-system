<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image API Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 40px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1d4ed8;
        }

        #status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        #imageContainer {
            margin-top: 25px;
        }

        #testImage {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #1d4ed8;
            display: none;
        }

        #imageUrl {
            margin-top: 15px;
            word-break: break-all;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Image API Test</h1>

        <div id="status">
            Checking API...
        </div>

        <div id="imageContainer">

            <img
                id="testImage"
                alt="API Image"
            >

            <p id="imageUrl"></p>

        </div>

    </div>

    <script src="js/image-test.js"></script>

</body>

</html>
