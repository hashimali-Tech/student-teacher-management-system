    <!-- =========================

    <header class="page-header">

        <div>
            <h1>Students</h1>
            <p>Manage and view all students</p>

        </a>

    <!-- =========================

    ========================== -->

    <main class="students-container">

        <!-- Student Statistics -->

        <section class="student-stats">

            <div class="stat-card">

                <span class="stat-title">
                    Total Students
                </span>

                <span id="studentCount" class="stat-number">
                    0
                </span>

            </div>

        </section>


        <!-- Loading Message -->

        <div id="loading">
            Loading students...
        </div>


        <!-- Error Message -->

        <div id="errorMessage"></div>


        <!-- Students Cards -->

        <section id="studentsContainer" class="students-grid">
            <!-- Student cards will be inserted by JavaScript -->
        </section>


        <!-- No Students -->

        <div id="noStudents" class="no-students">

            <h2>No Students Found</h2>

            <p>
                There are currently no students in the database.
            </p>

            <a href="add-student.html">
                Add Your First Student

        </div>
